# Redraws the three cards in the README (assets/cards/*.svg) from the public GitHub API, once a day.
name: Cards

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths: [scripts/cards.mjs]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Draw
        run: node scripts/cards.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit when something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          git diff --cached --quiet || (git commit -m "Refresh cards" && git push)
